[project]
name = "auto-fpa"
version = "1.0.0"
description = "Motor de inteligência financeira: DRE gerencial, ponto de equilíbrio, viabilidade de Capex e CFO Virtual com IA local."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
